<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Gamete intrafallopian transfer (GIFT)</title><desc id="desc">GIFT transfers gametes; IVF transfers an embryo. A functioning tube is needed.. Egg collection: Eggs are collected. Gametes transferred: Eggs + sperm into a tube. Fertilization inside: Embryo may form afterwards</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="#427c72"/></marker></defs><rect width="1200" height="440" rx="20" fill="#faf7f1"/><g font-family="Arial, sans-serif" fill="#193e49"><text x="30" y="36" font-size="16" letter-spacing="2" fill="#8a523a">SUPPLEMENTARY SCHEMATIC</text><text x="30" y="70" font-size="28" font-weight="bold">Gamete intrafallopian transfer (GIFT)</text><rect x="30.0" y="100" width="358.6666666666667" height="257" rx="16" fill="white" stroke="#d9e2dd"/><circle cx="53.0" cy="125" r="13" fill="#e5efea"/><text x="53.0" y="130" text-anchor="middle" font-size="14">1</text><ellipse cx="209.33333333333334" cy="191" rx="63" ry="37" fill="#f6d2c0" stroke="#bb7e69" stroke-width="3"/><circle cx="174.33333333333334" cy="191" r="9" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="179.33333333333334" cy="188" r="2.34" fill="#d79b78"/><circle cx="197.33333333333334" cy="179" r="12" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="202.33333333333334" cy="176" r="3.12" fill="#d79b78"/><circle cx="227.33333333333334" cy="191" r="18" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="232.33333333333334" cy="188" r="4.68" fill="#d79b78"/><circle cx="251.33333333333334" cy="199" r="9" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="256.33333333333337" cy="196" r="2.34" fill="#d79b78"/><text x="209.33333333333334" y="270" font-size="20" text-anchor="middle" font-weight="bold">Egg collection</text><text x="209.33333333333334" y="321" font-size="17" text