orm afterwards</text><text x="30" y="397" font-size="19" fill="#35685e">GIFT transfers gametes; IVF transfers an embryo. A functioning tube is needed.</text><text x="30" y="425" font-size="14" fill="#68787b">Original explanatory schematic based on the textbook concept. Not to scale.</text></g></svg>