b78"/><circle cx="624.0" cy="209" r="23" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="629.0" cy="206" r="5.98" fill="#d79b78"/><circle cx="621.0" cy="162" r="18" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="626.0" cy="159" r="4.68" fill="#d79b78"/><text x="600.0" y="270" font-size="20" text-anchor="middle" font-weight="bold">Cytoplasm transferred</text><text x="600.0" y="321" font-size="17" text-anchor="middle" fill="#4d6870">Recipient nuclear DNA stays</text><path d="M782.3333333333334 215H807.3333333333334" stroke="#427c72" stroke-width="3" marker-end="url(#arrow)"/><rect x="811.3333333333334" y="100" width="358.6666666666667" height="257" rx="16" fill="white" stroke="#d9e2dd"/><circle cx="834.3333333333334" cy="125" r="13" fill="#e5efea"/><text x="834.3333333333334" y="130" text-anchor="middle" font-size="14">3</text><ellipse cx="990.6666666666667" cy="214" rx="62" ry="15" fill="#d5edf0" stroke="#698d9a" stroke-width="3"/><path d="M928.6666666666667 191v23m124-23v23" stroke="#698d9a" stroke-width="3"/><ellipse cx="990.6666666666667" cy="191" rx="62" ry="15" fill="#edf8fa" stroke="#698d9a" stroke-width="3"/><circle cx="990.6666666666667" cy="188" r="10" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="995.6666666666667" cy="185" r="2.6" fill="#d79b78"/><ellipse cx="1020.6666666666667" cy="177" rx="5" ry="8" fill="#44667b"/><path d="M1020.6666666666667 185q-10 13 0 22t0 17" stroke="#44667b" stroke-width="2" fill="none"/><text x="990.6666666666667" y="270" font-size="20" text-anchor="middle" font-weight="bold">Fertilization follows</text><text x="990.6666666666667" y="321" font-size="17" text-anchor="middle" fill="#4d6870">This is not sperm injection</text><text x="30" y="397" font-size="19" fill="#35685e">Cytoplasm includes mitochondria. This is not a guaranteed way to prevent genetic defects.</text><text x="30" y="425" font-size="14" fill="#68787b">Original explanatory schematic based on the textbook concept. Not to s