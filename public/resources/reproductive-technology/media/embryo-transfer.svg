<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Embryo transfer to a gestational carrier</title><desc id="desc">The egg provider and the person who carries the pregnancy can be different people.. Egg + sperm providers: Provide nuclear genetic material. IVF in the laboratory: An embryo is created. Gestational carrier: Receives embryo in her uterus</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="#427c72"/></marker></defs><rect width="1200" height="440" rx="20" fill="#faf7f1"/><g font-family="Arial, sans-serif" fill="#193e49"><text x="30" y="36" font-size="16" letter-spacing="2" fill="#8a523a">FIGURE 16 · RECREATED</text><text x="30" y="70" font-size="28" font-weight="bold">Embryo transfer to a gestational carrier</text><rect x="30.0" y="100" width="358.6666666666667" height="257" rx="16" fill="white" stroke="#d9e2dd"/><circle cx="53.0" cy="125" r="13" fill="#e5efea"/><text x="53.0" y="130" text-anchor="middle" font-size="14">1</text><circle cx="209.33333333333334" cy="191" r="30" fill="#fff1de" stroke="#ce8058" stroke-width="3"/><circle cx="214.33333333333334" cy="188" r="7.800000000000001" fill="#d79b78"/><text x="209.33333333333334" y="270" font-size="20" text-anchor="middle" font-weight="bold">Egg + sperm providers</text><text x="209.33333333333334" y="321" font-size="17" text-anchor="middle" fill="#4d6870">Provide nuclear genetic material</text><path d="M391.6666666666667 215H416.6666666666667" stroke="#427c72" stroke-width="3" marker-end="url(#arrow)"/><rect x="420.6666666666667" y="100" width="358.6666666666667" height="257" rx="16" fill="white" stroke="#d9e2dd"/><circle cx="443.6666666666667" cy="125" r="13" fill="#e5efea"/><text x="443.6666666666667" y="130" text-anchor="middle" font-size="14">2</text><ellipse cx="600.0" cy="214" rx="62" ry="15" fill="#d5edf0" stroke="#698d9a" stroke-width="3"/><path d="M538.0