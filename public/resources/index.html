<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Course resources, investigations, case studies, and readings for Biology 20 and Biology 30.">
<title>Resources · Biology</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧬%3C/text%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem('review-theme')==='dark'?'dark':'light')}catch{}</script>
<style>
:root{color-scheme:light;--bg:#f6f8f9;--surface:#fff;--ink:#172a3b;--muted:#637281;--line:#dbe2e7;--green:#357050;--soft:#edf4ef;--navy:#183850}
html[data-theme=dark]{color-scheme:dark;--bg:#111b24;--surface:#1d2b37;--ink:#e4edf5;--muted:#a5b6c4;--line:#3b4c5b;--green:#94d5ab;--soft:#193a30;--navy:#9ac7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #3c85ba;outline-offset:4px}[hidden]{display:none!important}
header{height:72px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;text-decoration:none}.header-actions{display:flex;align-items:center;gap:10px}.control{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:10px 16px;font-size:14px;text-decoration:none}.control:hover{border-color:var(--muted)}#themeToggle{padding:8px;min-width:40px;font-size:18px;line-height:1}
main{max-width:924px;margin:0 auto;padding:32px 32px 70px}.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);min-height:24px}.breadcrumbs a{text-underline-offset:4px}.hero{padding:54px 0 28px}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(30px,4vw,46px);line-height:1.12;margin:16px 0}p{line-height:1.55}.intro{font-size:18px;color:var(--muted);max-width:640px;margin:0}.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:8px 0 30px}.course-card{display:block;position:relative;text-decoration:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:32px;min-height:180px}.course-card:hover{border-color:var(--navy)}.course-card strong{display:block;font-size:30px;margin:0 0 20px}.course-card small{font-size:15px;color:var(--muted)}.course-card .arrow{position:absolute;right:32px;bottom:28px;font-size:26px;color:var(--green)}.library-note{border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:14px}.library-note strong{color:var(--ink);font-weight:600}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:8px 0 22px}.count{font-size:14px;color:var(--muted)}.search{display:flex;align-items:center;gap:10px;max-width:330px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}.search span{color:var(--muted)}.search input{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-size:14px}.search:focus-within{outline:3px solid #3c85ba;outline-offset:3px}.search input:focus-visible{outline:none}.month-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:30px 0 12px}.resource-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.resource-list li+li{border-top:1px solid var(--line)}.resource-link{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:20px;padding:24px;text-decoration:none}.resource-link:hover{background:var(--soft)}.resource-link time{font-size:13px;color:var(--muted);line-height:1.5}.resource-link h3{margin:0;font-size:19px;line-height:1.3}.resource-link p{font-size:14px;color:var(--muted);margin:7px 0 0}.type{display:inline-block;color:var(--green);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:0 0 7px}.resource-link .arrow{font-size:22px;color:var(--green)}
.empty{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:50px 28px;text-align:center}.empty-icon{display:grid;place-items:center;border-radius:14px;width:54px;height:54px;margin:0 auto 20px;background:var(--soft);color:var(--green)}.empty-icon svg{width:26px;height:26px}.empty h2{font-size:23px;margin:0 0 12px}.empty p{max-width:440px;margin:0 auto;color:var(--muted);font-size:15px}.empty a{display:inline-block;margin-top:22px;color:var(--green);text-underline-offset:4px}.back-link{display:inline-block;color:var(--muted);font-size:14px;margin-top:26px;text-underline-offset:4px}
@media(max-width:650px){header{height:65px;padding:0 16px;gap:10px}.brand{font-size:15px}.header-actions{gap:6px}.control{padding:8px 10px;font-size:12px}main{padding:22px 16px 50px}.hero{padding:34px 0 24px}.intro{font-size:16px}.course-grid{grid-template-columns:1fr;gap:16px}.course-card{padding:24px;min-height:145px}.course-card strong{font-size:27px;margin-bottom:16px}.course-card .arrow{right:24px;bottom:22px}.list-tools{flex-direction:column;align-items:stretch;gap:14px}.search{max-width:none}.resource-link{padding:20px 16px;gap:12px;grid-template-columns:54px minmax(0,1fr) auto}.resource-link h3{font-size:17px}.resource-link p{font-size:13px}.resource-link time{font-size:12px}.empty{padding:38px 20px}}
</style>
</head>
<body>
<header><a class="brand" href="/" aria-label="Biology Review Bank home"><span aria-hidden="true">🧬</span> Biology Review Bank</a><div class="header-actions"><a class="control" href="/">Daily review</a><button id="themeToggle" class="control" aria-label="Switch to dark mode">🌙</button></div></header>
<main><nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Resources</span></nav><section id="view" aria-live="polite"><div class="hero"><span class="eyebrow">Coursework, investigations & study materials</span><h1>Resources</h1><p class="intro">Loading your course library…</p></div></section></main>
<script>
const view=document.querySelector('#view'),crumbs=document.querySelector('#breadcrumbs');let catalog;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
const dateValue=value=>/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value+'T12:00:00Z'));
const dateText=(value,options)=>new Intl.DateTimeFormat('en-CA',{...options,timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'));
function resourceURL(value){try{const u=new URL(value,location.href);if(!['https:','http:'].includes(u.protocol))return null;if(u.protocol==='http:'&&u.origin!==location.origin)return null;return u.href}catch{return null}}
function resources(course){return (course.resources||[]).filter(r=>r.title&&dateValue(r.date)&&resourceURL(r.href)).sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title))}
function hero(label,title,intro){const h=el('div','hero');h.append(el('span','eyebrow',label),el('h1','',title),el('p','intro',intro));return h}
function empty(title,message){const box=el('div','empty');const icon=el('div','empty-icon');icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v15c-3-1-6-1-9 1-3-2-6-2-9-1zM12 6v15"/></svg>';box.append(icon,el('h2','',title),el('p','',message));return box}
function breadcrumb(course){crumbs.replaceChildren();const home=el('a','','Home');home.href='/';crumbs.append(home,el('span','','/'));const library=el(course?'a':'span','','Resources');if(course)library.href='#';else library.setAttribute('aria-current','page');crumbs.append(library);if(course){crumbs.append(el('span','','/'));const current=el('span','',course.name);current.setAttribute('aria-current','page');crumbs.append(current)}for(const divider of crumbs.querySelectorAll('span'))if(divider.textContent==='/')divider.setAttribute('aria-hidden','true')}
function render(){view.replaceChildren();let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{id='missing'}const course=catalog.courses.find(c=>c.id===id);breadcrumb(course);if(id&&!course){view.append(hero('Course library','Course not found','Choose a course to browse its resources.'));const a=el('a','control','Choose course');a.href='#';view.append(a);return}
 if(!course){document.title='Resources · Biology';view.append(hero('Coursework, investigations & study materials','Resources','Choose your course to access coursework, complete investigations, and find materials for studying.'));const grid=el('div','course-grid');for(const c of catalog.courses){const a=el('a','course-card');a.href='#'+encodeURIComponent(c.id);const count=resources(c).length;a.append(el('strong','',c.name),el('small','',count+' '+(count===1?'resource':'resources')),el('span','arrow','→'));grid.append(a)}view.append(grid);return}
 document.title=course.name+' Resources · Biology';const items=resources(course);view.append(hero('Resources',course.name,'Coursework, investigations, and study materials, organized by date.'));if(!items.length){view.append(empty('No resources posted yet','Coursework, investigations, and study materials will appear here by date as they are added.'));const back=el('a','back-link','← Choose another course');back.href='#';view.append(back);return}
 const tools=el('div','list-tools'),count=el('span','count',items.length+' '+(items.length===1?'resource':'resources'));const search=el('label','search');const label=el('span','','Search');const input=el('input');input.type='search';input.placeholder='Find a topic or resource';input.setAttribute('aria-label','Search resources');search.append(label,input);tools.append(count,search);const list=el('div');view.append(tools,list);function draw(){list.replaceChildren();const query=input.value.trim().toLowerCase(),shown=items.filter(r=>[r.title,r.summary||'',r.type||'',r.date,dateText(r.date,{month:'long',year:'numeric'})].join(' ').toLowerCase().includes(query));count.textContent=(query?shown.length+' of ':'')+items.length+' '+(items.length===1?'resource':'resources');if(!shown.length){list.append(empty('No matching resources','Try a different topic, date, or resource type.'));return}let month='',ul;for(const r of shown){if(r.date.slice(0,7)!==month){month=r.date.slice(0,7);list.append(el('h2','month-title',dateText(r.date,{month:'long',year:'numeric'})));ul=el('ul','resource-list');list.append(ul)}const li=el('li'),a=el('a','resource-link');a.href=resourceURL(r.href);const date=el('time','',dateText(r.date,{month:'short',day:'numeric'}));date.dateTime=r.date;const copy=el('div');copy.append(el('span','type',r.type||'Resource'),el('h3','',r.title));if(r.summary)copy.append(el('p','',r.summary));const arrow=el('span','arrow','→');arrow.setAttribute('aria-hidden','true');a.append(date,copy,arrow);li.append(a);ul.append(li)}}input.oninput=draw;draw();const back=el('a','back-link','← Choose another course');back.href='#';view.append(back)}
const toggle=document.querySelector('#themeToggle');function showTheme(){const dark=document.documentElement.dataset.theme==='dark';toggle.textContent=dark?'☀️':'🌙';toggle.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');toggle.title=toggle.getAttribute('aria-label')}toggle.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('review-theme',document.documentElement.dataset.theme)}catch{}showTheme()};showTheme();
window.addEventListener('hashchange',()=>{if(catalog){render();window.scrollTo(0,0);const h=view.querySelector('h1');h.tabIndex=-1;h.focus({preventScroll:true})}});
fetch('/resources/catalog.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(!Array.isArray(data.courses))throw Error();catalog=data;render()}).catch(()=>{view.replaceChildren(hero('Course library','Resources','Course materials are temporarily unavailable.'),empty('Unable to load resources','Please refresh the page or try again in a moment.'));const retry=el('button','control','Try again');retry.onclick=()=>location.reload();view.append(retry)});
</script>
</body>
</html>
