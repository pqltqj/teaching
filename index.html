:root{color-scheme:light;--navy:#183850;--ink:#172a3b;--muted:#637281;--line:#dbe2e7;--green:#357050}*{box-sizing:border-box}body{margin:0;background:#f6f8f9;color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3c85ba;outline-offset:4px}button:disabled{opacity:.4;cursor:default}.hidden{display:none!important}header{height:72px;background:#fff;border-bottom:1px solid var(--line);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:center}.header-controls{display:flex;gap:10px}.control{background:white;border:1px solid var(--line);border-radius:7px;padding:10px 16px;font-size:14px}.control:hover{background:#edf2f5}.primary{background:var(--navy);color:white;border-color:var(--navy)}.primary:hover{background:#254d6b}main{max-width:1440px;margin:auto;padding:32px}.home{max-width:860px;padding-top:clamp(50px,10vh,110px);margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:bold;color:var(--green)}h1{font-size:clamp(30px,4vw,46px);line-height:1.1;margin:16px 0}p{line-height:1.5}.intro{font-size:18px;color:var(--muted)}.course-options{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px}.course-option{text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:32px;min-height:180px}.course-option:hover{border-color:var(--navy);background:#fdfefe}.course-option strong{display:block;font-size:30px;margin-bottom:20px}.course-option span{color:var(--muted);font-size:15px}.course-option .arrow{float:right;font-size:26px;color:var(--green)}.course-title{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.course-title h1{font-size:30px;margin:0 0 7px}.course-title p{margin:0;color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);border-radius:7px;padding:12px 18px;background:white;font-size:15px}.tab[aria-selected=true]{background:var(--navy);color:white;border-color:var(--navy)}.section-title{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:24px 0 18px}.section-title h2{font-size:23px;margin:0}.section-title p{font-size:13px;color:var(--muted);margin:6px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.flip-card{width:100%;min-height:250px;display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 2px 5px #172a3b04}.flip-card:hover{border-color:#8aa0b0}.card-top{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}.card-body{font-size:clamp(19px,1.55vw,26px);font-weight:500;line-height:1.35;margin:auto 0}.card-bottom{font-size:12px;color:var(--muted);margin-top:24px}.flip-card.revealed{background:#f0f6f2;border-color:#bfd4c5}.revealed .card-top{color:var(--green)}.revealed .card-body{font-size:clamp(17px,1.25vw,22px);line-height:1.45}.empty{padding:70px 24px;text-align:center;background:white;border:1px solid var(--line);border-radius:10px;margin-top:24px}.empty h2{font-size:24px}.empty p{color:var(--muted)}.random-wrap{max-width:940px;margin:auto}.random-card{min-height:clamp(280px,45vh,540px);padding:36px}.random-card .card-body{font-size:clamp(25px,3vw,43px)}.random-card.revealed .card-body{font-size:clamp(22px,2.3vw,34px)}.random-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px}.random-toolbar .group{display:flex;gap:10px}.random-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.status{color:var(--muted);font-size:14px}.error{padding:35px;text-align:center}.message{font-size:14px;color:var(--muted)}@media(min-width:1700px){.flip-card{min-height:300px}}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:0 16px;height:65px}.brand{font-size:16px}main{padding:22px 16px}.home{padding-top:40px}.course-options,.grid{grid-template-columns:1fr}.course-option{min-height:140px;padding:24px}.flip-card{min-height:210px}.course-title{align-items:flex-start}.section-title{align-items:flex-start}.random-card{padding:24px}.random-toolbar{flex-wrap:wrap}.random-toolbar .group{width:100%;justify-content:space-between}.header-controls .control{padding:8px 10px;font-size:12px}.tab{padding:10px 12px;font-size:14px}}@media print{header,.tabs,.section-title button,.random-toolbar,.random-hint,.card-bottom{display:none}.grid{grid-template-columns:1fr 1fr}.flip-card{break-inside:avoid;box-shadow:none;min-height:180px}body{background:white}}

{margin:0}@media(max-height:700px){body.whiteboard-active main{padding:10px 16px}.wb-toolbar{padding:8px 0}.wb-toolbar .control,.whiteboard-active .tab{padding:7px 10px;font-size:12px}.wb-cards{gap:8px}.wb-card{padding:10px;gap:10px}.wb-number{margin-bottom:5px}.wb-side h2{margin-bottom:6px}.wb-hint{display:none}}@media(max-width:650px){body.whiteboard-active main{height:calc(100dvh - 65px);padding:8px}.wb-boards{gap:8px}.wb-cards{gap:8px}.wb-card{padding:8px;gap:5px}.wb-arrow{font-size:25px}.wb-text{font-size:clamp(12px,2.5vw,17px)}.wb-card.revealed .wb-text{font-size:12px}.wb-toolbar{flex-wrap:wrap;font-size:11px;gap:5px}.wb-toolbar select{max-width:230px;padding:5px;font-size:11px}.wb-controls{gap:4px}.wb-toolbar .control{padding:6px;font-size:11px}.wb-hint{display:none}}

</style></head><body><header><div id="smartTitle"><button id="smartBack" class="control" aria-label="Return to review questions" title="Back">←</button><span>Smartboard View</span></div><div class="brand"><span aria-hidden="true">🍎</span> Biology Review Bank</div><div id="smartDate"></div><div class="header-controls header-right"><div id="smartControls" class="header-controls"></div><button id="smartboardButton" class="control hidden" title="Smartboard View" aria-label="Open Smartboard View">🖊️</button><button class="control hidden" id="homeButton">Choose course</button><button class="control" id="fullscreen">Fullscreen</button></div></header><main><section id="home" class="home"><span class="eyebrow">Daily review</span><h1>Choose your course</h1><p class="intro">Review a day’s questions, browse the whole bank, or practice in a random order.</p><div class="course-options" id="courseOptions"><button class="course-option" id="choose-biology30"><strong>Biology 30</strong><span>3 review sets · 18 questions</span><span class="arrow">→</span></button><button class="course-option" id="choose-biology20"><strong>Biology 20</strong><span>No review sets yet</span><span class="arrow">→</span></button></div></section><section id="course" class="hidden"><div class="course-title"><div><h1 id="courseName"></h1><p id="courseSummary"></p></div></div><div class="tabs" id="tabs"></div><section id="content" role="tabpanel"></section></section></main><script id="reviewData" type="application/json">{"courses": [{"id": "biology30", "name": "Biology 30", "sets": [{"date": "2026-10-15", "title": "Gastrulation & neurulation", "questions": [{"question": "What happens during gastrulation? Name the three germ layers that form.", "answer": "The developing embryo’s cells rearrange to form three germ layers: ectoderm on the outside, mesoderm in the middle, and endoderm on the inside."}, {"question": "Which germ layer forms each of these: skin, muscle, and the lining of the digestive tract?", "answer": "Ectoderm forms the outer layer of the skin. Mesoderm forms muscle. Endoderm forms the lining of the digestive tract."}, {"question": "What is organogenesis, and when does an embryo become a fetus?", "answer": "Organogenesis is the formation of organs from the germ layers. Major organ formation occurs during weeks 3–8 after fertilization. The fetal stage begins at the start of week 9 after fertilization."}, {"question": "Describe how the neural plate becomes the neural tube during neurulation.", "answer": "The neural plate forms from ectoderm. It folds inward, and the raised edges come together and fuse, forming a hollow neural tube."}, {"question": "What is the role of the notochord, and what does the neural tube develop into?", "answer": "The notochord sends signals that help trigger neurulation. The neural tube develops into the brain and spinal cord, which make up the central nervous system."}, {"question": "Why is folic acid important early in development? How is spina bifida related to neural tube closure?", "answer": "Folic acid supports normal neural tube development and helps reduce the risk of neural tube defects. Spina bifida involves incomplete closure in the spinal region, which can affect the spinal cord and surrounding vertebrae."}]}, {"date": "2026-10-14", "title": "Cleavage, implantation & pregnancy", "questions": [{"question": "What is cleavage, and what happens to cell size as the zygote divides?", "answer": "Cleavage is a series of rapid mitotic divisions with little overall growth. The number of cells increases, but each cell becomes smaller."}, {"question": "How is the structure of a morula different from that of a blastocyst?", "answer": "A morula is a solid ball of cells. A blastocyst has a fluid-filled cavity, an outer cell layer, and a group of cells inside."}, {"question": "What do the inner cell mass and trophoblast develop into?", "answer": "The inner cell mass forms the embryo. The trophoblast helps implantation and contributes to the fetal part of the placenta, which supports the embryo."}, {"question": "What is implantation, and where does it occur?", "answer": "Implantation is when the blastocyst attaches to and embeds in the endometrium, the lining of the uterus."}, {"question": "How does hCG help maintain the uterine lining during early pregnancy?", "answer": "hCG maintains the corpus luteum so it continues producing progesterone. Progesterone maintains the endometrium, helping support the developing embryo."}, {"question": "Which hormone does a home pregnancy test detect, and how does it produce a positive result?", "answer": "The test detects hCG in urine. Antibodies in the test bind to hCG, producing a visible test line. The control line shows that the test worked."}]}, {"date": "2026-10-13", "title": "Fertilization", "questions": [{"question": "Where does fertilization usually occur, and how many chromosomes does a normal human zygote have?", "answer": "Fertilization usually occurs in an oviduct (fallopian tube). A normal zygote has 46 chromosomes: 23 from the sperm and 23 from the egg."}, {"question": "What are the corona radiata and zona pellucida, and how are they different?", "answer": "The corona radiata is a layer of cells around the egg. The zona pellucida is a protective glycoprotein coat beneath those cells. Sperm must pass through both to reach the egg membrane."}, {"question": "How does the acrosomal reaction help a sperm reach the egg membrane?", "answer": "The acrosome in the sperm head releases enzymes. These enzymes help the sperm pass through the egg’s surrounding coat so it can reach and fuse with the egg membrane."}, {"question": "How does the cortical reaction help prevent more than one sperm from fertilizing an egg?", "answer": "After the first sperm fuses with the egg, cortical granules in the egg release their contents. These change the zona pellucida, making it harder for other sperm to bind to or pass through it."}, {"question": "A sperm cannot release the enzymes in its acrosome. What would likely happen, and why?", "answer": "The sperm would have difficulty passing through the zona pellucida. It would be less likely to reach the egg membrane, so fertilization would be less likely."}, {"question": "What is polyspermy, and why is it harmful to the developing zygote?", "answer": "Polyspermy means more than one sperm enters the egg. Each sperm adds chromosomes, so the zygote has too many. This disrupts normal development."}]}]}, {"id": "biology20", "name": "Biology 20", "sets": []}]}</script><script>
const $=s=>document.querySelector(s);let mainDate='',wbDate='',wbPage=0,returnMode='all';let bank,course=null,mode='all',revealed=new Set(),deck=[],position=0,randomRevealed=false;
const formatDate=date=>new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function allQuestions(){return course.sets.flatMap(set=>set.questions.map((question,index)=>({...question,id:set.date+':'+index,date:set.date,title:set.title,number:index+1})))}
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function chooseCourse(id){course=bank.courses.find(c=>c.id===id);course.sets.sort((a,b)=>a.date.localeCompare(b.date));mainDate=course.sets[0]?.date||'';mode=mainDate||'all';revealed.clear();deck=[];randomRevealed=false;$('#home').classList.add('hidden');$('#course').classList.remove('hidden');$('#homeButton').classList.remove('hidden');$('#smartboardButton').classList.remove('hidden');renderCourse()}
function changeMode(next){if(course.sets.some(s=>s.date===next))mainDate=next;if(next==='whiteboard'){returnMode=mode==='whiteboard'?returnMode:mode;wbDate=course.sets.some(s=>s.date===mode)?mode:(mainDate||course.sets[0]?.date||'all');wbPage=0}mode=next;revealed.clear();randomRevealed=false;if(mode==='random'){deck=shuffled(allQuestions());position=0}renderCourse()}
function renderTabs(){const nav=$('#tabs');nav.replaceChildren();const picker=element('div','date-picker');const label=element('label','','Review date');label.htmlFor='reviewDate';const select=element('select');select.id='reviewDate';select.className=course.sets.some(s=>s.date===mode)?'active':'';select.setAttribute('aria-label','Review date');course.sets.forEach(set=>{const option=element('option','',formatDate(set.date)+' · '+set.title);option.value=set.date;option.selected=mainDate===set.date;select.append(option)});if(!course.sets.length){select.append(element('option','','No review sets'));select.disabled=true}select.onchange=()=>{changeMode(select.value);$('#reviewDate').focus()};picker.append(label,select);nav.append(picker);const tablist=element('div','mode-tabs');tablist.setAttribute('role','tablist');tablist.setAttribute('aria-label','Review modes');const choices=[{id:'all',label:'All Questions'},{id:'random',label:'Random Order'}];choices.forEach(({id,label},index)=>{const b=element('button','tab',label);b.id='tab-'+index;b.setAttribute('role','tab');b.setAttribute('aria-selected',String(mode===id));b.tabIndex=(mode===id||!choices.some(c=>c.id===mode)&&index===0)?0:-1;b.onclick=()=>changeMode(id);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?choices.length-1:(index+(e.key==='ArrowRight'?1:-1)+choices.length)%choices.length;changeMode(choices[next].id);$('#tab-'+next).focus()}};tablist.append(b)});nav.append(tablist);$('#content').setAttribute('aria-labelledby',choices.some(c=>c.id===mode)?'tab-'+choices.findIndex(c=>c.id===mode):'reviewDate')}
function makeCard(q,random=false){const answer=random?randomRevealed:revealed.has(q.id);let b=element('button','flip-card'+(answer?' revealed':'')+(random?' random-card':''));b.type='button';b.setAttribute('aria-pressed',String(answer));b.setAttribute('aria-label',(answer?'Answer: '+q.answer:'Question: '+q.question)+'. '+(answer?'Click to show question.':'Click to reveal answer.'));let top=element('div','card-top');top.append(element('span','',answer?'ANSWER':'QUESTION '+q.number));top.append(element('span','',formatDate(q.date)));b.append(top,element('div','card-body',answer?q.answer:q.question),element('div','card-bottom',answer?'Click to return to the question':'Click to reveal the answer'));b.onclick=()=>{if(random)randomRevealed=!randomRevealed;else revealed.has(q.id)?revealed.delete(q.id):revealed.add(q.id);renderContent();const restored=random?$('#randomCard'):document.querySelector('[data-question-id="'+q.id+'"]');restored?.focus({preventScroll:true})};if(random)b.id='randomCard';else b.dataset.questionId=q.id;return b}
function renderCourse(){document.body.classList.toggle('whiteboard-active',mode==='whiteboard');$('#courseName').textContent=course.name;let count=allQuestions().length;$('#courseSummary').textContent=`${course.sets.length} ${course.sets.length===1?'review set':'review sets'} · ${count} ${count===1?'question':'questions'}`;renderTabs();renderContent()}
function renderContent(){let container=$('#content');container.replaceChildren();const all=allQuestions();if(mode==='whiteboard'){renderWhiteboard(container);return}if(!all.length){let empty=element('div','empty');empty.append(element('h2','','No questions yet'),element('p','','Review sets will appear here as they are added.'));container.append(empty);return}if(mode==='random'){renderRandom(container);return}const selected=mode==='all'?all:all.filter(q=>q.date===mode);const set=course.sets.find(s=>s.date===mode);const row=element('div','section-title');let titles=element('div');titles.append(element('h2','',mode==='all'?'All Questions':set.title),element('p','',mode==='all'?'Every review set for '+course.name:formatDate(mode)));let toggle=element('button','control',selected.every(q=>revealed.has(q.id))?'Hide all answers':'Reveal all answers');toggle.onclick=()=>{const hide=selected.every(q=>revealed.has(q.id));selected.forEach(q=>hide?revealed.delete(q.id):revealed.add(q.id));renderContent()};row.append(titles,toggle);container.append(row);let grid=element('div','grid');selected.forEach(q=>grid.append(makeCard(q)));container.append(grid)}
function renderRandom(container){const wrap=element('div','random-wrap');const heading=element('div','section-title');let title=element('div');title.append(element('h2','','Random Order'),element('p','','All '+course.name+' questions · no repeats until the deck is finished'));let shuffle=element('button','control','Shuffle again');shuffle.onclick=()=>{deck=shuffled(allQuestions());position=0;randomRevealed=false;renderContent()};heading.append(title,shuffle);wrap.append(heading,makeCard(deck[position],true));let toolbar=element('div','random-toolbar');toolbar.append(element('span','status',`Question ${position+1} of ${deck.length}`));let controls=element('div','group');let prev=element('button','control','← Previous');prev.id='randomPrevious';prev.disabled=position===0;prev.onclick=()=>move(-1);let next=element('button','control primary',position===deck.length-1?'Start a new shuffle':'Next →');next.id='randomNext';next.onclick=()=>{if(position===deck.length-1){deck=shuffled(allQuestions());position=0;randomRevealed=false;renderContent()}else move(1)};controls.append(prev,next);toolbar.append(controls);wrap.append(toolbar,element('p','random-hint','Click the card to reveal the answer · ← / → move through the deck'));container.append(wrap)}
function move(delta){position=Math.max(0,Math.min(deck.length-1,position+delta));randomRevealed=false;renderContent()}
$('#smartBack').onclick=()=>changeMode(returnMode);$('#smartboardButton').onclick=()=>changeMode('whiteboard');$('#homeButton').onclick=()=>{document.body.classList.remove('whiteboard-active');course=null;$('#course').classList.add('hidden');$('#home').classList.remove('hidden');$('#homeButton').classList.add('hidden');$('#smartboardButton').classList.add('hidden');$('#courseOptions button')?.focus()};$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('#fullscreen').textContent='Use F11'}};document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen');document.addEventListener('keydown',e=>{if(!course||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('select,input,textarea,[role="tab"]'))return;if(mode==='whiteboard')return;if(mode!=='random'||!deck.length)return;if(e.key==='ArrowRight'){e.preventDefault();$('#randomNext').click()}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});

function wbQuestions(){const all=allQuestions();return wbDate==='all'?all:all.filter(q=>q.date===wbDate)}
function wbMove(delta){wbPage=Math.max(0,Math.min(Math.ceil(wbQuestions().length/6)-1,wbPage+delta));revealed.clear();renderContent()}
function renderWhiteboard(container){const questions=wbQuestions();const pageCount=Math.max(1,Math.ceil(questions.length/6));wbPage=Math.min(wbPage,pageCount-1);const shown=questions.slice(wbPage*6,wbPage*6+6);const toolbar=$('#smartControls');toolbar.replaceChildren();$('#smartDate').replaceChildren();{const select=element('select');select.id='wbDate';select.setAttribute('aria-label','Review date');course.sets.forEach(set=>{let o=element('option','',formatDate(set.date)+' · '+set.title);o.value=set.date;o.selected=wbDate===set.date;select.append(o)});select.onchange=()=>{wbDate=select.value;wbPage=0;revealed.clear();renderContent()};if(!course.sets.length){let o=element('option','','No review sets');select.append(o);select.disabled=true}$('#smartDate').append(select)}if(pageCount>1){const next=element('button','control',`Next six (${wbPage+1}/${pageCount}) →`);next.onclick=()=>{wbPage=(wbPage+1)%pageCount;revealed.clear();renderContent()};toolbar.append(next)}const hide=shown.every(q=>revealed.has(q.id));let reveal=element('button','control',hide?'Hide answers':'Reveal answers');reveal.onclick=()=>{shown.forEach(q=>hide?revealed.delete(q.id):revealed.add(q.id));renderContent()};reveal.disabled=!shown.length;toolbar.append(reveal);if(!shown.length){let empty=element('div','empty');empty.append(element('h2','','No questions yet'),element('p','','Review sets will appear here as they are added.'));container.append(empty);return}const boards=element('div','wb-boards');const leftCount=Math.min(3,Math.ceil(shown.length/2));for(let side=0;side<2;side++){let column=element('section','wb-side'+(side?' wb-right':''));column.append(element('h2','',side?'RIGHT WHITEBOARD →':'← LEFT WHITEBOARD'));const cards=element('div','wb-cards');const items=side?shown.slice(leftCount):shown.slice(0,leftCount);items.forEach(q=>{const answer=revealed.has(q.id);const card=element('button','wb-card'+(answer?' revealed':''));card.dataset.wbId=q.id;card.setAttribute('aria-pressed',String(answer));const arrow=element('span','wb-arrow',side?'→':'←');arrow.setAttribute('aria-hidden','true');const copy=element('span','wb-copy');copy.append(element('span','wb-number',`${answer?'ANSWER':'QUESTION'} ${q.number}`),element('span','wb-text',answer?q.answer:q.question));card.append(arrow,copy);card.onclick=()=>{answer?revealed.delete(q.id):revealed.add(q.id);renderContent();document.querySelector('[data-wb-id="'+q.id+'"]')?.focus({preventScroll:true})};cards.append(card)});for(let i=items.length;i<3;i++){const blank=element('div','wb-placeholder');blank.setAttribute('aria-hidden','true');cards.append(blank)}column.append(cards);boards.append(column)}container.append(boards)}

bank=JSON.parse($('#reviewData').textContent);bank.courses.forEach(c=>{const b=$('#choose-'+c.id);const count=c.sets.reduce((n,s)=>n+s.questions.length,0);b.children[0].textContent=c.name;b.children[1].textContent=count?`${c.sets.length} ${c.sets.length===1?'review set':'review sets'} · ${count} questions`:'No review sets yet';b.onclick=()=>chooseCourse(c.id)});
</script></body></html>
